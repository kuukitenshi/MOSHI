[package]
name    = "bench_frost"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bench_frost"
path = "src/main.rs"

[dependencies]
frost-ed25519  = "2.2"
ed25519-dalek  = { version = "2", features = ["rand_core"] }
rand_core      = { version = "0.6", features = ["getrandom"] }
rand_chacha    = "0.3"
serde_json     = "1"
