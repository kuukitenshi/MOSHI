[package]
name = "shared"
version = "0.1.0"
edition = "2021"

[dependencies]
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
