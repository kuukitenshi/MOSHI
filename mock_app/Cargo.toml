[package]
name = "mock_app"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../shared" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
frost-ed25519 = "2.2"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
