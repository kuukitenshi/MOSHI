<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Authentication Error</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e4e6ef; margin: 0; padding: 2rem; }
  .container { max-width: 600px; margin: 0 auto; }
  .error-card { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); border-radius: 12px; padding: 1.5rem; margin: 2rem 0; }
  .error-card h2 { color: #f87171; margin: 0 0 0.5rem 0; font-size: 1.1rem; }
  .error-card p { color: #fca5a5; margin: 0; font-size: 0.9rem; font-family: monospace; word-break: break-all; }
  a { color: #60a5fa; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <h1>Demo Relying Party</h1>
  <div class="error-card">
    <h2>Authentication Error</h2>
    <p>{{ERROR_MESSAGE}}</p>
  </div>
  <p><a href="/">Back to sign-in</a></p>
</div>

</html>
